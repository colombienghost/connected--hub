<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONNECTED — prototype</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a1420;font-family:'Inter',system-ui,sans-serif}
  *{-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{display:none}
  button{font-family:inherit}
  input[type=range]{height:4px;border-radius:999px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* ===== tokens (miroir de tokens-v3.js) ===== */
const T = {
  canvasTop:'#FAFBFD', canvasBottom:'#E9EDF3',
  glass:'rgba(255,255,255,0.96)', glassDeep:'rgba(6,37,79,0.08)',
  hairline:'rgba(6,37,79,0.14)', veil:'rgba(250,251,253,0.88)',
  ink:'#06254F', deep:'#06254F', slate:'#536985', slate2:'#7890AA', sky:'#8DBCE2', pale:'#D6E8F7',
  amber:'#FFB000', amberDeep:'#D98D00', onAmber:'#172B45', amberSoft:'rgba(255,176,0,0.16)',
  skySoft:'rgba(214,232,247,0.78)', deepSoft:'rgba(6,37,79,0.10)', danger:'#DC2626', dangerSoft:'rgba(220,38,38,0.10)',
  white:'#fff',
};
const R = { card:22, field:16, pill:999 };

/* ===== icônes ===== */
const P = {
  home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  box:'M21 8.5 12 3 3 8.5v7L12 21l9-5.5zM3 8.5 12 14l9-5.5M12 14v7',
  plus:'M12 5v14M5 12h14',
  chat:'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z',
  user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  bell:'M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
  menu:'M3 6h18M3 12h18M3 18h18',
  back:'M19 12H5M12 19l-7-7 7-7',
  search:'M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zM21 21l-4.3-4.3',
  swap:'M7 4v13M4 7l3-3 3 3M17 20V7M14 17l3 3 3-3',
  plane:'M2 21 21 12 2 3l0 7 13 2-13 2z',
  star:'M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-.9z',
  check:'M20 6 9 17l-5-5',
  lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
  minus:'M5 12h14',
  chevron:'M9 6l6 6-6 6',
  send:'M22 2 11 13M22 2l-7 20-4-9-9-4z',
  filter:'M4 5h16M7 12h10M10 19h4',
  share:'M4 12v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8M16 6l-4-4-4 4M12 2v14',
  card:'M2 7h20v12H2zM2 11h20',
  bag:'M6 7V6a6 6 0 0 1 12 0v1M4 7h16l-1 13H5z',
  gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L4.1 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z',
  help:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01',
  logout:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
  users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
  trend:'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6',
  pin:'M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
};
function Icon({n, s=22, c='currentColor', f='none', w=1.85}){
  return <svg width={s} height={s} viewBox="0 0 24 24" fill={f} stroke={c} strokeWidth={w} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={P[n]}/></svg>;
}

/* ===== chrome ===== */
function StatusBar(){
  return <div style={{height:44,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 22px',flexShrink:0}}>
    <span style={{fontSize:14,fontWeight:700,color:T.ink}}>9:41</span>
    <div style={{display:'flex',alignItems:'center',gap:5}}>
      {[3,5,7,9].map((h,i)=><div key={i} style={{width:3,height:h,borderRadius:1,background:T.ink,opacity:.85}}/>)}
      <div style={{width:22,height:11,marginLeft:4,border:`1px solid ${T.slate2}`,borderRadius:3,padding:1.5}}><div style={{width:'72%',height:'100%',borderRadius:1,background:T.ink}}/></div>
    </div>
  </div>;
}
function Phone({children}){
  return <div style={{width:390,height:844,background:`linear-gradient(180deg,${T.canvasTop},${T.canvasBottom})`,borderRadius:42,border:`1px solid rgba(255,255,255,.6)`,boxShadow:'0 30px 80px rgba(10,31,58,.28)',overflow:'hidden',display:'flex',flexDirection:'column',position:'relative'}}>{children}</div>;
}
function Glass({children,style,onClick}){
  return <div onClick={onClick} style={{background:T.glass,border:`1px solid ${T.hairline}`,borderRadius:R.card,backdropFilter:'blur(18px)',WebkitBackdropFilter:'blur(18px)',...style}}>{children}</div>;
}
function Avatar({src,init,size=44,ring}){
  return src
    ? <img src={src} alt="" style={{width:size,height:size,borderRadius:'50%',objectFit:'cover',flexShrink:0,border:ring?`2px solid ${ring}`:`1px solid ${T.hairline}`}}/>
    : <div style={{width:size,height:size,borderRadius:'50%',flexShrink:0,background:T.deepSoft,border:`1px solid ${T.hairline}`,display:'flex',alignItems:'center',justifyContent:'center',color:T.deep,fontWeight:700,fontSize:size*.34}}>{init}</div>;
}
const IMG = {
  moussa:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=faces',
  awa:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200&h=200&fit=crop&crop=faces',
  ibrahim:'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&h=200&fit=crop&crop=faces',
  fatou:'https://images.unsplash.com/photo-1594744803329-e58b31de8bf5?w=200&h=200&fit=crop&crop=faces',
};

function Btn({kind='primary',children,onClick,style}){
  const [d,setD]=useState(false);
  const base={width:'100%',height:52,borderRadius:R.field,cursor:'pointer',fontSize:16,fontWeight:700,fontFamily:'inherit',border:'none',transition:'transform .12s,background .12s',transform:d?'scale(.985)':'none'};
  const kinds={
    primary:{background:d?T.amberDeep:T.amber,color:T.onAmber},
    access:{background:d?'#083357':T.deep,color:'#fff'},
    ghost:{background:'transparent',border:`1.5px solid ${T.deep}`,color:T.deep,fontWeight:600},
  };
  return <button onClick={onClick} onPointerDown={()=>setD(true)} onPointerUp={()=>setD(false)} onPointerLeave={()=>setD(false)} style={{...base,...kinds[kind],...style}}>{children}</button>;
}

function Header({title,onBack,right}){
  return <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 14px 10px',flexShrink:0}}>
    {onBack? <button onClick={onBack} style={ib}><Icon n="back" s={20} c={T.ink}/></button> : <div style={{width:38}}/>}
    <span style={{fontSize:17,fontWeight:700,color:T.ink}}>{title}</span>
    {right||<div style={{width:38}}/>}
  </div>;
}
const ib={background:'none',border:'none',cursor:'pointer',padding:8,color:T.ink,display:'flex'};

function Pill({label}){
  const map={
    'En attente':[T.amberSoft,T.amberDeep], 'En cours':[T.skySoft,T.deep],
    'Livré':[T.deepSoft,T.deep], 'Annulé':[T.dangerSoft,T.danger], 'Vérifié':[T.deepSoft,T.deep],
  };
  const [bg,fg]=map[label]||[T.deepSoft,T.deep];
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,background:bg,color:fg,fontSize:12,fontWeight:700,padding:'5px 10px',borderRadius:R.pill}}>
    {(label==='Livré'||label==='Vérifié')&&<Icon n="check" s={12} c={fg} w={2.6}/>}{label}
  </span>;
}
function Stepper({step}){
  const steps=['Détails','Paiement','Confirmation'];
  return <div style={{display:'flex',alignItems:'center',padding:'0 6px',margin:'2px 0 18px'}}>
    {steps.map((s,i)=>(<React.Fragment key={s}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,flexShrink:0}}>
        <div style={{width:30,height:30,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,
          background:i<step?T.deep:i===step?T.amber:T.deepSoft, color:i<step?'#fff':i===step?T.onAmber:T.slate}}>
          {i<step? <Icon n="check" s={15} c="#fff" w={2.6}/> : i+1}</div>
        <span style={{fontSize:11,fontWeight:600,color:i===step?T.ink:T.slate}}>{s}</span>
      </div>
      {i<2&&<div style={{flex:1,height:2,background:i<step?T.deep:T.hairline,margin:'0 6px',marginBottom:20}}/>}
    </React.Fragment>))}
  </div>;
}

/* ===== illustrations ===== */
function Radar({size=150}){
  return <svg width={size} height={size} viewBox="0 0 120 120" aria-hidden="true">
    {[30,20,10].map((r,i)=><circle key={i} cx="60" cy="60" r={r} fill="none" stroke={T.deep} strokeWidth="1.4" opacity={.3+i*.18}/>)}
    <line x1="30" y1="34" x2="60" y2="60" stroke={T.deep} strokeWidth="2.4" strokeLinecap="round"/>
    <circle cx="60" cy="60" r="3.6" fill={T.deep}/>
    <circle cx="82" cy="35" r="4.4" fill={T.amber}/><circle cx="60" cy="90" r="4.4" fill="none" stroke={T.deep} strokeWidth="2.2"/><circle cx="88" cy="74" r="4.4" fill={T.deep}/>
  </svg>;
}
function Corridor({h=150}){
  return <svg viewBox="0 0 320 150" style={{width:'100%',height:h}} aria-hidden="true">
    <path d="M40 118 Q160 20 280 118" fill="none" stroke={T.deep} strokeWidth="2" strokeDasharray="6 6" opacity=".55"/>
    <g transform="translate(150 40) rotate(28)"><path d={P.plane} fill={T.deep} transform="scale(1.1) translate(-12 -12)"/></g>
    <circle cx="40" cy="118" r="14" fill={T.skySoft}/><circle cx="40" cy="118" r="5" fill={T.deep}/>
    <circle cx="280" cy="118" r="14" fill={T.skySoft}/><circle cx="280" cy="118" r="5" fill={T.deep}/>
    <text x="40" y="142" textAnchor="middle" fill={T.slate} fontSize="12" fontWeight="600">Montréal</text>
    <text x="280" y="142" textAnchor="middle" fill={T.slate} fontSize="12" fontWeight="600">Abidjan</text>
  </svg>;
}

/* ===== data ===== */
const CORRIDORS=[
  {from:'Montréal',to:'Abidjan',ff:'🇨🇦',tf:'🇨🇮',price:'60 $'},
  {from:'Paris',to:'Dakar',ff:'🇫🇷',tf:'🇸🇳',price:'55 $'},
  {from:'New York',to:'Lagos',ff:'🇺🇸',tf:'🇳🇬',price:'65 $'},
];
const TRAVELERS=[
  {name:'Ibrahim K.',img:IMG.ibrahim,rating:4.8,reviews:127,kg:'23 kg disponibles',ppk:'45 $/kg',date:'15 juin 2026'},
  {name:'Awa T.',img:IMG.awa,rating:4.9,reviews:86,kg:'18 kg disponibles',ppk:'48 $/kg',date:'15 juin 2026'},
  {name:'Moussa K.',img:IMG.moussa,rating:4.9,reviews:203,kg:'30 kg disponibles',ppk:'50 $/kg',date:'16 juin 2026'},
];
const SHIPMENTS=[
  {route:'Montréal → Abidjan',ref:'#C-4587',date:'12 juin 2026',status:'En attente'},
  {route:'Toronto → Dakar',ref:'#C-4521',date:'05 juin 2026',status:'En cours'},
  {route:'Paris → Bamako',ref:'#C-4410',date:'28 mai 2026',status:'Livré'},
];
const CHATS=[
  {name:'Moussa K.',img:IMG.moussa,last:'Parfait, on se retrouve au terminal 1',time:'10:33',unread:2},
  {name:'Awa T.',img:IMG.awa,last:'J\u2019ai encore 2 places disponibles',time:'Hier',unread:0},
  {name:'Ibrahim K.',img:IMG.ibrahim,last:'Merci pour votre confiance',time:'Lun',unread:1},
];
const CATEGORIES=['Documents','Vêtements','Électronique','Alimentaire','Cosmétiques','Autre'];

/* ===== bottom nav (composant unique) ===== */
function BottomNav({tab,go}){
  const items=[{id:'home',icon:'home',label:'Accueil'},{id:'search',icon:'box',label:'Trajets'},null,{id:'chats',icon:'chat',label:'Messages',badge:2},{id:'profile',icon:'user',label:'Profil'}];
  return <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-around',background:T.deep,padding:'10px 6px 24px',position:'relative',flexShrink:0,color:'#fff'}}>
    {items.map((it,i)=> it===null
      ? <div key="fab" style={{width:56}}>
          <div onClick={()=>go('publish')} style={{position:'absolute',left:'50%',top:-22,transform:'translateX(-50%)',width:58,height:58,borderRadius:'50%',background:T.amber,border:'5px solid #fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 5px 14px rgba(6,37,79,.24)'}}><Icon n="plus" s={25} c={T.onAmber} w={2.4}/></div>
          <div style={{fontSize:10,fontWeight:600,color:'#fff',textAlign:'center',marginTop:26}}>Publier</div>
        </div>
      : <button key={it.id} onClick={()=>go(it.id)} style={{background:'none',border:'none',cursor:'pointer',padding:0,display:'flex',flexDirection:'column',alignItems:'center',gap:4,width:62,fontFamily:'inherit',color:tab===it.id?T.amber:'#fff'}}>
          <div style={{position:'relative'}}><Icon n={it.icon} s={22}/>{it.badge&&<span style={{position:'absolute',top:-4,right:-6,minWidth:15,height:15,borderRadius:R.pill,background:T.amber,color:T.onAmber,fontSize:9,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px'}}>{it.badge}</span>}</div>
          <span style={{fontSize:10,fontWeight:600}}>{it.label}</span>
        </button>
    )}
  </div>;
}
function Scroll({children,pad=20}){return <div style={{flex:1,overflowY:'auto',padding:`4px ${pad}px 12px`}}>{children}</div>;}

/* ================= ÉCRANS ================= */

function Onboarding({go}){
  const [i,setI]=useState(0);
  const S=[
    {h:'Envoyez plus simplement.',sub:'CONNECTED relie votre colis à un voyageur de confiance.',img:'generated_images/connected-signup-step-1-name.png'},
    {h:'Trouvez un trajet adapté.',sub:'Comparez les itinéraires, les dates et la capacité disponible.',img:'generated_images/connected-signup-step-2-country.png'},
    {h:'Choisissez votre rôle.',sub:'Expéditeur ou convoyeur, une seule communauté CONNECTED.',img:'generated_images/connected-signup-step-3-role.png'},
    {h:'Échangez en toute clarté.',sub:'Chaque conversation reste liée à votre colis ou votre trajet.',img:'generated_images/connected-signup-step-4-phone.png'},
    {h:'Une communauté vérifiée.',sub:'Les profils et les documents sont contrôlés pour inspirer confiance.',img:'generated_images/connected-signup-step-5-identity.png'},
    {h:'Bienvenue dans CONNECTED.',sub:'Votre prochaine connexion commence ici.',img:'generated_images/connected-signup-step-6-complete.png'},
  ][i];
  return <Phone><StatusBar/>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 22px'}}>
      <div style={{width:34,height:34,borderRadius:'50%',border:`1.4px solid ${T.amber}`,display:'flex',alignItems:'center',justifyContent:'center',color:T.amber,fontSize:12,fontWeight:700}}>{i+1}/6</div>
      <button onClick={()=>go('login')} style={{...ib,color:T.slate,fontSize:14,fontWeight:600}}>Passer</button>
    </div>
    <div style={{flex:1,display:'flex',flexDirection:'column',padding:'16px 24px 0'}}>
      <h1 style={{margin:0,fontSize:30,fontWeight:800,lineHeight:1.15,color:T.ink}}>{S.h}</h1>
      <p style={{margin:'12px 0 0',fontSize:15,lineHeight:1.55,color:T.slate}}>{S.sub}</p>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',margin:'10px -8px'}}><img src={S.img} alt="" style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:'center top',borderRadius:22}}/></div>
      {i===5&&<div style={{display:'flex',flexDirection:'column',gap:10}}><Btn onClick={()=>go('login')}>Commencer</Btn><Btn kind="ghost" onClick={()=>go('search')}>Trouver un voyageur</Btn></div>}
    </div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 24px 28px'}}>
      <div style={{display:'flex',gap:6}}>{[0,1,2,3,4,5].map(d=><div key={d} style={{width:d===i?18:6,height:6,borderRadius:R.pill,background:d===i?T.amber:T.deepSoft,transition:'width .2s'}}/>)}</div>
      {i<5&&<button onClick={()=>setI(i+1)} style={{height:40,padding:'0 22px',borderRadius:R.pill,cursor:'pointer',background:T.deep,border:'none',color:'#fff',fontSize:14,fontWeight:700,fontFamily:'inherit'}}>Suivant</button>}
    </div>
  </Phone>;
}

function Login({go}){
  return <Phone><StatusBar/>
    <div style={{flex:1,display:'flex',flexDirection:'column',padding:'8px 24px 28px'}}>
      <div style={{textAlign:'center',marginTop:8}}>
        <div style={{width:60,height:60,margin:'0 auto',borderRadius:18,background:T.deep,display:'flex',alignItems:'center',justifyContent:'center'}}><Radar size={40}/></div>
        <h1 style={{margin:'16px 0 4px',fontSize:26,fontWeight:800,color:T.ink}}>Bienvenue</h1>
        <p style={{margin:0,color:T.slate,fontSize:15}}>Connectez-vous à votre compte</p>
      </div>
      <div style={{display:'flex',gap:24,margin:'22px 0 18px',justifyContent:'center'}}>
        <span style={{fontWeight:700,color:T.ink,borderBottom:`2.5px solid ${T.amber}`,paddingBottom:8}}>Connexion</span>
        <span onClick={()=>go('register')} style={{fontWeight:600,color:T.slate,paddingBottom:8,cursor:'pointer'}}>Inscription</span>
      </div>
      <label style={lb}>Adresse e-mail</label>
      <Glass style={{...fld}}>exemple@domaine.com</Glass>
      <label style={lb}>Mot de passe</label>
      <Glass style={{...fld,display:'flex',alignItems:'center',justifyContent:'space-between'}}>••••••••<Icon n="lock" s={16} c={T.slate}/></Glass>
      <div style={{textAlign:'right',margin:'10px 0 18px'}}><span style={{color:T.deep,fontSize:13,fontWeight:600,cursor:'pointer'}}>Mot de passe oublié ?</span></div>
      <Btn kind="access" onClick={()=>go('home')}>Se connecter</Btn>
      <p style={{textAlign:'center',marginTop:'auto',color:T.slate,fontSize:14}}>Pas encore de compte ? <span onClick={()=>go('register')} style={{color:T.deep,fontWeight:700,cursor:'pointer'}}>S\u2019inscrire</span></p>
    </div>
  </Phone>;
}
const lb={fontSize:13,fontWeight:600,color:T.slate,margin:'0 0 8px'};
const fld={background:T.glass,border:`1px solid ${T.hairline}`,borderRadius:R.field,padding:'0 16px',height:52,display:'flex',alignItems:'center',color:T.ink,fontSize:15,marginBottom:16};

function Register({go}){
  const [sel,setSel]=useState('exp');
  const Card=({id,title,desc,icon,img})=>(
    <Glass onClick={()=>setSel(id)} style={{padding:16,marginBottom:14,border:`1.5px solid ${sel===id?T.deep:T.hairline}`,display:'flex',alignItems:'center',gap:14,cursor:'pointer'}}>
      <Avatar src={img} size={54}/>
      <div style={{flex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}><Icon n={icon} s={18} c={T.deep}/><span style={{fontSize:17,fontWeight:700,color:T.ink}}>{title}</span></div>
        <div style={{fontSize:13,color:T.slate,marginTop:4,lineHeight:1.4}}>{desc}</div>
      </div>
      <div style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${sel===id?T.amber:T.hairline}`,display:'flex',alignItems:'center',justifyContent:'center'}}>{sel===id&&<div style={{width:11,height:11,borderRadius:'50%',background:T.amber}}/>}</div>
    </Glass>
  );
  return <Phone><StatusBar/><Header title="Créer un compte" onBack={()=>go('login')}/>
    <div style={{flex:1,display:'flex',flexDirection:'column',padding:'4px 24px 28px'}}>
      <p style={{margin:'0 0 18px',color:T.slate,fontSize:15,textAlign:'center'}}>Choisissez votre profil pour commencer</p>

/* ===== composants formulaire ===== */
function Category({value,onChange}){
  const toggle=(c)=>onChange(value.includes(c)?value.filter(x=>x!==c):[...value,c]);
  return <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
    {CATEGORIES.map(c=>{const on=value.includes(c);return <span key={c} onClick={()=>toggle(c)} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'9px 14px',borderRadius:R.pill,fontSize:13,fontWeight:700,cursor:'pointer',background:on?T.amberSoft:T.white,color:on?T.amberDeep:T.slate,border:`1px solid ${on?'transparent':T.hairline}`}}>{on&&<Icon n="check" s={12} c={T.amberDeep} w={2.6}/>}{c}</span>;})}
  </div>;
}
function NumField({value,setValue,unit,step=1,min=0}){
  return <div style={{display:'flex',alignItems:'center',gap:12}}>
    <Sq onClick={()=>setValue(Math.max(min,+(value-step).toFixed(2)))}><Icon n="minus" s={16} c={T.deep}/></Sq>
    <div style={{display:'flex',alignItems:'baseline',gap:4,minWidth:92,justifyContent:'center'}}>
      <input value={value} onChange={e=>{const v=e.target.value.replace(/[^0-9.]/g,'');setValue(v===''?0:+v);}} inputMode="decimal" style={{width:56,textAlign:'right',border:'none',background:'transparent',fontSize:18,fontWeight:800,color:T.ink,fontFamily:'inherit',outline:'none'}}/>
      <span style={{fontSize:13,color:T.slate,fontWeight:600}}>{unit}</span>
    </div>
    <Sq onClick={()=>setValue(+(value+step).toFixed(2))}><Icon n="plus" s={16} c={T.deep}/></Sq>
  </div>;
}

function Reserve({go}){
  const AVAIL=30, PPK=45;

  const [cats,setCats]=useState(['Vêtements']);
  const k=Math.min(Math.max(1,kg||1),AVAIL);
  return <Phone><StatusBar/><Header title="Réserver une place" onBack={()=>go('trip')}/>
    <Scroll>
      <Glass style={{padding:16,marginBottom:16,display:'flex',alignItems:'center',gap:12}}>

      </Glass>
      <label style={lb}>Catégories du colis</label>
      <div style={{marginBottom:18}}><Category value={cats} onChange={setCats}/></div>
      <label style={lb}>Poids à réserver · {AVAIL} kg disponibles</label>
      <Glass style={{padding:'16px'}}>
        <NumField value={kg} setValue={setKg} unit="kg"/>
        <input type="range" min="1" max={AVAIL} value={k} onChange={e=>setKg(+e.target.value)} style={{width:'100%',marginTop:16,accentColor:T.amber}}/>

    <div style={{padding:'12px 20px 26px',borderTop:`1px solid ${T.hairline}`,background:'rgba(255,255,255,.85)',backdropFilter:'blur(18px)'}}>

}
